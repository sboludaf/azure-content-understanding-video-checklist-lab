<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1010" viewBox="0 0 680 1010" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de la aplicación de checklist de vídeo con azd</title>
  <desc id="desc">Cada lector despliega los recursos en su suscripción con azd provision y azd deploy. El navegador accede desde la IP autorizada a Azure App Service Linux B1. FastAPI y FFmpeg extraen fotogramas y tiempos, llaman a Azure Foundry Responses v1 y devuelven la checklist y los informes. El modelo y las regiones son configurables. El estado y el ledger SQLite persisten en home/video-checklist. Azure Container Registry construye y entrega la imagen; una identidad administrada de Microsoft Entra permite acceder al modelo y al registro.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#317e6b"/></marker>
  </defs>
  <rect width="680" height="1010" rx="20" fill="#f7faf9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18353b" text-anchor="middle">
    <text x="340" y="43" font-size="28" font-weight="700">Despliegue con azd</text>
    <text x="340" y="75" font-size="20" fill="#526b70">Infraestructura del repositorio</text>

    <rect x="180" y="105" width="320" height="90" rx="14" fill="#18353b"/>
    <text x="340" y="142" font-size="24" font-weight="700" fill="#ffffff">Navegador</text>
    <text x="340" y="172" font-size="20" fill="#d9ede8">Vídeo · checklist · informes</text>

    <rect x="40" y="235" width="270" height="90" rx="14" fill="#ffffff" stroke="#bed8d0" stroke-width="2"/>
    <text x="175" y="268" font-size="21" font-weight="700">Container Registry</text>
    <text x="175" y="297" font-size="19" fill="#526b70">Construcción e imagen</text>
    <rect x="370" y="235" width="270" height="90" rx="14" fill="#ffffff" stroke="#bed8d0" stroke-width="2"/>
    <text x="505" y="268" font-size="22" font-weight="700">Microsoft Entra ID</text>
    <text x="505" y="297" font-size="19" fill="#526b70">Identidad administrada</text>

    <path d="M 340 195 V 363" fill="none" stroke="#317e6b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="308" y="206" width="64" height="24" rx="6" fill="#f7faf9"/>
    <text x="340" y="224" font-size="16" fill="#317e6b">HTTPS</text>
    <path d="M 175 325 V 363" fill="none" stroke="#317e6b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 505 325 V 363" fill="none" stroke="#317e6b" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

    <rect x="40" y="365" width="600" height="330" rx="18" fill="#e7f4ee" stroke="#76ad9b" stroke-width="2"/>
    <text x="340" y="402" font-size="25" font-weight="700">App Service Linux B1</text>
    <text x="340" y="430" font-size="20" fill="#526b70">Contenedor · acceso desde tu IP</text>

    <rect x="70" y="455" width="320" height="190" rx="14" fill="#ffffff" stroke="#bed8d0" stroke-width="2"/>
    <text x="230" y="492" font-size="24" font-weight="700">Python / FastAPI</text>
    <text x="230" y="529" font-size="22">FFmpeg</text>
    <text x="230" y="560" font-size="20" fill="#526b70">Fotogramas + tiempos</text>
    <text x="230" y="591" font-size="20" fill="#526b70">Revisión humana separada</text>
    <text x="230" y="622" font-size="20" fill="#526b70">Exportaciones HTML / JSON</text>

    <rect x="420" y="455" width="190" height="190" rx="14" fill="#ffffff" stroke="#bed8d0" stroke-width="2"/>
    <text x="515" y="491" font-size="23" font-weight="700">/home</text>
    <text x="515" y="526" font-size="19">Estado persistente</text>
    <text x="515" y="556" font-size="19">Trabajos y revisión</text>
    <text x="515" y="595" font-size="21" font-weight="700">Ledger SQLite</text>
    <text x="515" y="624" font-size="19">Persistente</text>
    <path d="M 390 552 H 418" fill="none" stroke="#317e6b" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <path d="M 180 645 V 793" fill="none" stroke="#317e6b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 350 795 V 647" fill="none" stroke="#317e6b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="119" y="726" width="122" height="28" rx="6" fill="#f7faf9"/>
    <text x="180" y="747" font-size="20" fill="#317e6b">Solicitud</text>
    <rect x="286" y="726" width="128" height="28" rx="6" fill="#f7faf9"/>
    <text x="350" y="747" font-size="20" fill="#317e6b">Respuesta</text>

    <rect x="70" y="795" width="540" height="125" rx="16" fill="#18353b"/>
    <text x="340" y="832" font-size="25" font-weight="700" fill="#ffffff">Azure Foundry Responses v1</text>
    <text x="340" y="865" font-size="22" fill="#ffffff">Análisis real de tus fotogramas</text>
    <text x="340" y="897" font-size="20" fill="#d9ede8">Modelo y región configurables</text>

    <text x="340" y="959" font-size="19" fill="#526b70">Cada lector despliega en su suscripción.</text>
    <text x="340" y="987" font-size="19" fill="#526b70">azd provision · azd deploy · azd down</text>
  </g>
</svg>
