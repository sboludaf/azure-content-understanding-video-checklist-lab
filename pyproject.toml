[project]
name = "video-checklist-lab"
version = "0.1.0"
description = "Local review of manual procedure videos with Azure Content Understanding"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "azure-identity>=1.21,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
